<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - JavaScript Foundation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h2>SpendWise</h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">Dashboard</a>
                <a href="#" class="nav-item">Analytics</a>
                <a href="#" class="nav-item">Expenses</a>
                <a href="#" class="nav-item">Settings</a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <h1>SpendWise Budget Tracker</h1>
                <div class="user-profile">
                    <span>Abdirahman</span>
                    <div class="avatar">A</div>
                </div>
            </header>

            <!-- Main Content Overview -->
            <main class="cards-grid">
                <div class="card">
                    <h3>JavaScript Foundation Loaded</h3>
                    <p>Open your browser console (F12 -> Console) to interact with the budget calculation prompts.</p>
                </div>
            </main>
        </div>
    </div>

    <!-- 1. Link JavaScript File -->
    <script src="script.js"></script>
