<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h2>SpendWise</h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">Dashboard</a>
                <a href="#" class="nav-item">Analytics</a>
                <a href="#" class="nav-item">Expenses</a>
                <a href="#" class="nav-item">Settings</a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <h1>Overview</h1>
                <div class="user-profile">
                    <span>Abdirahman</span>
                    <div class="avatar">A</div>
                </div>
            </header>

            <!-- Dashboard Cards Grid (At least 6 category cards) -->
            <main class="cards-grid">
                <div class="card" tabindex="0">
                    <h3>Food</h3>
                    <p class="amount">$450.00</p>
                    <span class="status">Monthly Budget</span>
                </div>

                <div class="card" tabindex="0">
                    <h3>Transport</h3>
                    <p class="amount">$180.00</p>
                    <span class="status">Monthly Budget</span>
                </div>

                <div class="card" tabindex="0">
                    <h3>Rent</h3>
                    <p class="amount">$1,200.00</p>
                    <span class="status">Fixed Cost</span>
                </div>

                <div class="card" tabindex="0">
                    <h3>Entertainment</h3>
                    <p class="amount">$150.00</p>
                    <span class="status">Leisure</span>
                </div>

                <div class="card" tabindex="0">
                    <h3>Savings</h3>
                    <p class="amount">$600.00</p>
                    <span class="status">Target Saved</span>
                </div>

                <div class="card" tabindex="0">
                    <h3>Utilities</h3>
                    <p class="amount">$210.00</p>
                    <span class="status">Bills Paid</span>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
